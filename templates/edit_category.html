{% extends 'base.html' %}
{% block title %}Edit Category{% endblock %}
{% block content %}
<div class="card">
  <h2>Edit Category</h2>
  <form method="post">
    <label>Name</label><input name="name" value="{{ category.name }}" required>
    <label>Description</label><input name="description" value="{{ category.description or '' }}">
    <button type="submit">Update</button>
    <a class="btn gray" href="{{ url_for('list_categories') }}">Cancel</a>
  </form>
</div>
{% endblock %}
