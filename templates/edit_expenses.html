{% extends 'base.html' %}
{% block title %}Edit Expense{% endblock %}
{% block content %}
<div class="card">
  <h2>Edit Expense</h2>
  <form method="post">
    <label>Title</label><input name="title" value="{{ expense.title }}" required>
    <label>Amount</label><input type="number" name="amount" step="0.01" min="0.01" value="{{ expense.amount }}" required>
    <label>Date</label><input type="date" name="date" value="{{ expense.date }}" required>
    <label>Category</label>
    <select name="category_id">
      <option value="">Uncategorized</option>
      {% for c in categories %}
      <option value="{{ c.id }}" {% if expense.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
    <button type="submit">Update</button>
    <a class="btn gray" href="{{ url_for('dashboard') }}">Cancel</a>
  </form>
</div>
{% endblock %}
