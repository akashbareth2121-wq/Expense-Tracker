{% extends 'base.html' %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="card">
  <h2>Categories</h2>
  <a class="btn" href="{{ url_for('add_category') }}">Add Category</a>
  <table style="margin-top:14px">
    <tr><th>Name</th><th>Description</th><th></th></tr>
    {% for c in categories %}
    <tr>
      <td>{{ c.name }}</td><td>{{ c.description or '' }}</td>
      <td>
        <a class="btn gray" href="{{ url_for('edit_category', id=c.id) }}">Edit</a>
        <form method="post" action="{{ url_for('delete_category', id=c.id) }}"
              onsubmit="return confirm('Delete this category?')">
          <button class="danger" type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="3">No categories yet.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
